<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2ede2">
    <meta name="format-detection" content="telephone=no">
    <title>H A N Y U L I U | 个人视觉与思考记录</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link id="siteFontSheet" rel="stylesheet" href="https://fonts.loli.net/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=LXGW+WenKai+TC:wght@300;400&family=Noto+Serif+SC:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.loli.net/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=LXGW+WenKai+TC:wght@300;400&family=Noto+Serif+SC:wght@300;400;500&display=swap"></noscript>
    <!-- 按顺序加载，请勿调整：base → home → gallery → effects -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/effects.css">
</head>
<body class="mode-home">

    <svg class="paper-edge-filter" width="0" height="0" aria-hidden="true" focusable="false">
        <filter id="paper-rough" x="-15%" y="-15%" width="130%" height="130%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="9" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="paper-rough-soft" x="-20%" y="-40%" width="140%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="page-transition-curtain" id="pageCurtain">
        <div class="curtain-scene">
            <div class="curtain-eyebrow" id="curtainEyebrow"></div>
            <div class="curtain-text" id="curtainText">
                <span class="curtain-rule"></span>
                <div class="curtain-hint">
                    <span id="curtainHintText"></span><span class="curtain-dots" id="curtainDots" aria-hidden="true"><i></i><i></i><i></i></span>
                </div>
            </div>
        </div>
        <div class="curtain-veil" id="curtainVeil"></div>
    </div>

    <div class="home-breeze-layer" id="breezeContainer">
        <div class="breeze-slot active" id="breezeSlotA">
            <div class="breeze-clone clone-1"></div>
            <div class="breeze-clone clone-2"></div>
        </div>
        <div class="breeze-slot" id="breezeSlotB">
            <div class="breeze-clone clone-1"></div>
            <div class="breeze-clone clone-2"></div>
        </div>
        <div class="breeze-thin-veil"></div>
    </div>

    <div class="vintage-paper-grain"></div>
    <div class="paper-light-leak" aria-hidden="true"></div>

    <div id="space-home" class="space-wrapper active">
        <header class="site-header">
            <div class="header-main">
                <div class="logo-area">
                    <h1 class="site-title" id="ui-site-title"></h1>
                    <span class="site-subtitle" id="ui-site-subtitle"></span>
                </div>

                <nav class="site-nav">
                    <button class="nav-btn active" id="btn-featured" onclick="switchTab('featured')"></button>
                    <button class="nav-btn" id="btn-archive" onclick="switchTab('archive')"></button>
                </nav>
            </div>
        </header>

        <main id="view-featured" class="view-section active">
            <div class="featured-split-layout">

                <div class="featured-card-wrap">
                    <div class="featured-left">
                        <div class="work-intro-block">
                            <h2 class="hero-exhibition-title">
                                <span class="title-main" id="feat-title-main"></span>
                            </h2>
                            <span class="hero-exhibition-date" id="feat-title-sub"></span>
                            <p class="hero-exhibition-quote" id="feat-desc"></p>
                        </div>

                        <div class="showcase-switch" onclick="enterGalleryAtCurrent()">
                            <div class="switch-row">
                                <span class="switch-index" id="live-num">01 / 09</span>
                                <div class="showcase-dots" id="feat-dots"></div>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" id="slide-progress"></div>
                            </div>
                        </div>

                        <div class="hero-action">
                            <button class="enter-gallery-btn" id="feat-enter-btn" onclick="enterGalleryAtCurrent()"></button>
                            <p class="rotate-hint" id="ui-rotate-hint"></p>
                        </div>
                    </div>

                    <span class="paper-tape" aria-hidden="true"></span>

                    <aside class="mood-note">
                        <span class="mood-dot"></span>
                        <div class="mood-note-body">
                            <span class="mood-date" id="ui-mood-date"></span>
                            <p class="mood-content" id="ui-mood-text"></p>
                        </div>
                    </aside>
                </div>

                <div class="featured-right">
                    <button class="showcase-arrow prev" id="feat-prev-btn" onclick="moveSlide(-1)">‹</button>
                    <div class="showcase-stage" id="feat-stage" onclick="enterGalleryAtCurrent()"></div>
                    <button class="showcase-arrow next" id="feat-next-btn" onclick="moveSlide(1)">›</button>
                </div>

            </div>
        </main>

        <main id="view-archive" class="view-section">
            <p class="archive-intro" id="ui-archive-desc"></p>

            <div class="archive-toolbar">
                <div class="archive-filters" id="archive-filters"></div>
                <div class="archive-tools">
                    <input type="search" class="archive-search" id="archive-search" placeholder="" autocomplete="off">
                    <div class="archive-sort" id="archive-sort">
                        <button type="button" class="archive-sort-btn active" data-sort="default"></button>
                        <button type="button" class="archive-sort-btn" data-sort="newest"></button>
                        <button type="button" class="archive-sort-btn" data-sort="oldest"></button>
                    </div>
                </div>
            </div>

            <div id="archive-grid-container"></div>
            <div class="archive-empty" id="archive-empty" style="display: none;"></div>
        </main>
    </div>

    <div id="space-gallery" class="space-wrapper">
        <header class="gallery-topbar">
            <a href="javascript:void(0)" class="back-link" id="gal-back-link" onclick="closeGalleryToHome()"></a>
            <div class="gallery-top-title" id="gal-top-title"></div>
            <div class="gallery-music-placeholder"></div>
        </header>

        <div class="gallery-container" id="gal-container">
            <button class="page-nav-arrow arrow-left" id="gal-prev-btn" onclick="changeChapter(-1)">‹</button>
            <button class="page-nav-arrow arrow-right" id="gal-next-btn" onclick="changeChapter(1)">›</button>

            <div class="gallery-left" id="gal-left-stage"></div>
            <div class="gallery-right" id="gal-right-notes"></div>
        </div>

        <footer class="gallery-footer" id="gal-footer-dots"></footer>
    </div>

    <div class="finale-overlay" id="finaleOverlay" onclick="if(event.target === this) finaleDismiss()">
        <div class="finale-card">
            <div class="finale-eyebrow" id="finale-eyebrow"></div>
            <h2 class="finale-title" id="finale-title"></h2>
            <p class="finale-text" id="finale-text"></p>

            <div class="finale-divider"><span id="finale-divider-text"></span></div>

            <div class="finale-rec" id="finale-rec">
                <h3 class="finale-rec-title" id="finale-next-title"></h3>
                <span class="finale-rec-date" id="finale-next-date"></span>
            </div>

            <div class="finale-actions">
                <button class="finale-btn-primary" id="finale-enter-btn" onclick="finaleEnterNext()"></button>
                <button class="finale-btn-ghost" id="finale-replay-btn" onclick="finaleReplayCurrent()"></button>
                <button class="finale-btn-ghost" id="finale-home-btn" onclick="closeGalleryToHome()"></button>
            </div>

            <div class="finale-hint" id="finale-hint"></div>
        </div>
    </div>

    <div class="global-music-dock" id="musicDock">
        <button class="music-toggle-btn" id="globalPlayBtn" onclick="toggleGlobalMusic()">
            <span class="vinyl-disc" id="globalWave"></span>
            <canvas class="audio-viz" id="audioViz" width="34" height="14"></canvas>
            <span class="music-state" id="globalMusicState"></span><span id="globalTrackName"></span>
        </button>
        <button class="music-next-btn" id="globalNextBtn" onclick="nextGlobalMusic()" style="display:none;"><svg class="music-next-icon" viewBox="0 0 14 14" width="12" height="12" aria-hidden="true"><path d="M2.5 2.5L9 7L2.5 11.5V2.5Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><line x1="11.2" y1="2.8" x2="11.2" y2="11.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <audio id="masterAudio" preload="metadata"></audio>
    </div>

    <!-- 数据与脚本加载顺序：先设置与文案，再主题与各作品自注册，最后功能模块 -->
    <script src="data/site-settings.js"></script>
    <script src="data/site-text.js"></script>
    <script src="data/themes.js"></script>
    <script src="data/work-1.js"></script>
    <script src="data/work-2.js"></script>
    <script src="data/work-3.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/archive.js"></script>
    <script src="js/breeze.js"></script>
    <script src="js/home.js"></script>
    <script src="js/music.js"></script>
    <script src="js/audio-viz.js"></script>
    <script src="js/chapter-dissolve.js"></script>
    <script src="js/space-dissolve.js"></script>
    <script src="js/tilt.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/paper-edge.js"></script>
    <script src="js/main.js"></script>
    <script src="js/touch.js"></script>
</body>
</html>
